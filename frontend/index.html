<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e5631" />
    <title>MandiQ — Mandi Price Intelligence</title>

    <!-- Premium Fonts: Inter (numbers/English) + Noto Sans Devanagari (Hindi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Sans+Gurmukhi:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }

      /* Smooth scroll everywhere */
      * { -webkit-tap-highlight-color: transparent; }
      html { scroll-behavior: smooth; }

      /* iOS safe area */
      body { padding-bottom: env(safe-area-inset-bottom); }

      /* Hide scrollbar but keep scroll */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- OneSignal Web Push -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "6ad18ee9-92e5-4519-a38d-c16d2c8c0eda",
          allowLocalhostAsSecureOrigin: true,
          notifyButton: { enable: false },
        });
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
