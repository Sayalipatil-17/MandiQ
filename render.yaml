services:
  - type: web
    name: mandiq-backend
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: TWOFACTOR_API_KEY
        sync: false
      - key: TWOCAPTCHA_API_KEY
        sync: false
